name: build-signer

on:
  workflow_dispatch:
  push:
    paths:
      - 'Sources/**'
      - 'project.yml'
      - '.github/workflows/build-signer.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          swift --version

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 解析依赖
        run: |
          xcodebuild -project YZLSigner.xcodeproj \
            -scheme YZLSigner \
            -resolvePackageDependencies 2>&1 | tail -30

      - name: 编译
        run: |
          set -o pipefail
          xcodebuild build \
            -project YZLSigner.xcodeproj \
            -scheme YZLSigner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            OTHER_CODE_SIGN_FLAGS="" \
            ARCHS=arm64 \
            2>&1 | tee build.log | tail -60

      - name: 错误摘要
        if: failure()
        run: |
          echo "===== error/warning ====="
          grep -E "error:|error " build.log | head -40 || true

      - name: 打包 ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          test -d "$APP"
          STEM=$(basename "$APP" .app)
          # 主程序必须是真正的主体，不是 debug dylib 的空壳
          EXE="$APP/$STEM"
          EXE_SIZE=$(stat -f%z "$EXE")
          echo "主程序 $EXE = $EXE_SIZE bytes"
          if [ "$EXE_SIZE" -lt 1000000 ]; then
            echo "ERROR: 主程序过小（$EXE_SIZE），很可能又生成了 debug dylib"
            ls -la "$APP"
            exit 1
          fi
          if [ -e "$APP/$STEM.debug.dylib" ]; then
            echo "ERROR: 存在 $STEM.debug.dylib，真机签名后会加载失败"
            ls -la "$APP"
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry YZLSigner-unsigned.ipa Payload
          ls -lh YZLSigner-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: YZLSigner-unsigned
          path: YZLSigner-unsigned.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 7
